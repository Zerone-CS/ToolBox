[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "npu-container-manager"
version = "1.0.0"
description = "A command-line tool for managing Docker containers with Huawei Ascend NPU devices"
readme = "README.md"
requires-python = ">=3.6"
license = {text = "MIT"}
authors = [
    {name = "NPU Container Manager Contributors"}
]
keywords = ["npu", "ascend", "docker", "container", "huawei", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/yourusername/npu-manager"
Repository = "https://github.com/yourusername/npu-manager"
Issues = "https://github.com/yourusername/npu-manager/issues"

[project.scripts]
npu-manager = "npu_container_manager:main"

[tool.setuptools]
py-modules = ["npu_container_manager"]

[tool.black]
line-length = 100
target-version = ['py36']

[tool.mypy]
python_version = "3.6"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
